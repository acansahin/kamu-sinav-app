name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tum_icerik_acik:
        description: "Tüm konuları aç (cihazda test için; yayına GİTMEZ)"
        type: boolean
        default: true

# Android SDK yerel makinede kurulu değildir ve kurulması da gerekmez.
# APK yalnızca burada üretilir.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # Capacitor 8 / Android Gradle Plugin Java 21 ister.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # Sıra önemli: Capacitor `out/` klasörünü WebView varlıklarına kopyalar,
      # dolayısıyla statik export önce üretilmiş olmalıdır.
      # `tum_icerik_acik` YALNIZCA elle tetiklendiğinde okunur; `main`e push
      # ile üretilen debug APK gerçek uygulamanın davranışını korur (girdi
      # tanımsız olduğu için ifade '0' verir). İmzalı AAB'yi üreten
      # `android-release.yml` bu değişkeni hiç geçmez ve geçmemelidir.
      - name: Statik export üret
        run: npm run build
        env:
          NEXT_PUBLIC_TEST_FULL_ACCESS: ${{ (github.event_name == 'workflow_dispatch' && inputs.tum_icerik_acik) && '1' || '0' }}

      - name: Web varlıklarını Android projesine kopyala
        run: npx cap sync android

      - name: Debug APK derle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      # Artefakt adı kilit durumunu söyler: iki APK dosya olarak birbirinin
      # aynısıdır ve indirildikten sonra ayırt edilemezdi.
      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: kamu-sinav-akademi-debug${{ (github.event_name == 'workflow_dispatch' && inputs.tum_icerik_acik) && '-tum-icerik-acik' || '' }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
