name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # İçerik doğrulaması ayrı bir adımdır: kırılırsa hatanın kaynağı
      # (şema ihlali mi, telif kuralı mı) doğrudan görünür olsun.
      - name: İçeriği doğrula ve derle
        run: npm run content:build

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Birim testler
        run: npx vitest run

      - name: Statik export
        run: npm run build

      # Tarayıcı yalnızca uçtan uca adım için indirilir; chromium hem
      # masaüstü hem mobil profilini karşılar.
      - name: Playwright tarayıcısını kur
        run: npx playwright install --with-deps chromium

      # Bu adım hem 5 kritik akışı hem axe-core erişilebilirlik kapısını
      # çalıştırır. WCAG ihlali build'i kırar — erişilebilirlik taahhüdü
      # belgede kalmasın diye (PROJECT_PLAN.md §13.2).
      - name: Uçtan uca ve erişilebilirlik testleri
        run: npm run e2e

      - name: Başarısız testlerin raporunu yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Web çıktısını yükle
        uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: out/
          retention-days: 7
